# Runs the GSA FPKI crawler weekly, checks the result, and pushes a branch that updates the
# same four paths as the manual process. It then opens a weekly issue with the summary and a
# link that opens a prefilled PR. A person opens the PR, reviews it and merges it.
name: FPKI crawler update

on:
  schedule:
    - cron: '0 14 * * 1'   # Monday 14:00 UTC
    - cron: '0 14 * * 2'   # Tuesday safety net. Stops early if this week's issue already exists
  workflow_dispatch:
    inputs:
      push_branch:
        description: Push the update branch and open the weekly issue. Turn off to only generate and check the files
        type: boolean
        default: true

permissions: {}

concurrency:
  group: fpki-crawler
  cancel-in-progress: false

env:
  CRAWLER_REPOSITORY: GSA/FPKIcrawler
  CRAWLER_COMMIT: a8b0eee3b8cb2709c4f67b083b144ba27f9683f6
  JAR_SHA256: 1c26d064e89c1b520213979b74145a75b2db040051d3e3a2397f2128986a2b36
  ROOT_SHA256: 5f9aecc24616b2191372600dd80f6dd320c8ca5a0ceb7f09c985ebf0696934fc
  # One attempt while the workflow is being proven: anything unusual fails visibly.
  # Set to '2' later for a single retry.
  ATTEMPTS: '1'
  RETRY_WAIT_SECONDS: '900'

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.crawl.outputs.result }}
      week: ${{ steps.week.outputs.week }}
      run_date: ${{ steps.week.outputs.run_date }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v7
        with:
          ref: staging
          path: site
          persist-credentials: false

      - name: Stop if this week's issue already exists
        id: week
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          week="$(TZ=America/New_York date +%G-W%V)"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "run_date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          # A scheduled run stops if this week's issue exists in any state, including one a person
          # closed. A branch without an issue, left by a failed step, does not stop it.
          if [ "${{ github.event_name }}" = schedule ]; then
            issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json number,body \
              --jq "map(select(.body | contains(\"fpki-crawler-branch: fpki-crawler/$week \"))) | .[0].number // empty")"
            if [ -n "$issue" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "This week's issue already exists: #$issue." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Check out the crawler at the pinned commit
        if: steps.week.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CRAWLER_REPOSITORY }}
          ref: ${{ env.CRAWLER_COMMIT }}
          path: crawler
          persist-credentials: false

      - name: Verify the root certificate and Java helper
        if: steps.week.outputs.skip != 'true'
        run: |
          echo "$JAR_SHA256  crawler/py-crawler/py_crawler/data/pathbuilder-1.2.jar" | sha256sum -c -
          echo "$ROOT_SHA256  crawler/py-crawler/py_crawler/data/fcpcag2.crt" | sha256sum -c -

      - uses: actions/setup-python@v7
        if: steps.week.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        if: steps.week.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked Python dependencies
        if: steps.week.outputs.skip != 'true'
        run: pip install --require-hashes --no-deps -r site/.github/fpki-crawler/requirements.txt

      - name: Record whether revocation servers are reachable
        if: steps.week.outputs.skip != 'true'
        run: |
          # A plain GET only shows whether the server answers. OCSP servers often close the
          # connection without a reply, curl exit 52, which still means the server is reachable.
          for url in http://ocsp.disa.mil/ http://crl.disa.mil/ http://repo.fpki.gov/; do
            read -r status seconds code message <<< "$(curl -s -o /dev/null --max-time 10 \
              -w '%{http_code} %{time_total} %{exitcode} %{errormsg}' "$url" || true)"
            case "$code" in
              0)  result="reachable, HTTP $status" ;;
              52) result="reachable, closed the connection without a reply" ;;
              *)  result="not reachable, curl exit $code: $message" ;;
            esac
            echo "::notice title=Server check::$url $result, after ${seconds}s"
          done

      - name: Crawl and check the result
        id: crawl
        if: steps.week.outputs.skip != 'true'
        env:
          # Java waits 15 seconds for each unreachable OCSP server, but the crawler stops the
          # Java helper after 10. Accepted certificates are decided by CRLs, so wait 1 second.
          JAVA_TOOL_OPTIONS: -Dcom.sun.security.ocsp.timeout=1
        run: |
          result=fail
          for attempt in $(seq 1 "$ATTEMPTS"); do
            out="$RUNNER_TEMP/attempt-$attempt"
            mkdir -p "$out"
            echo "::group::Attempt $attempt"
            started=$(date +%s)
            if (cd crawler/py-crawler && set -o pipefail && OUTPUT_DIR="$out" timeout 30m python -m py_crawler 2>&1 | tee "$out/console.log"); then
              echo "::notice title=Crawl finished::Attempt $attempt took $(( $(date +%s) - started )) seconds."
              set +e
              python site/.github/fpki-crawler/check_run.py "$out" site/_implement/tools \
                --exclusions crawler/py-crawler/exclude_thumbprints.txt \
                --note "Crawler ${CRAWLER_REPOSITORY}@${CRAWLER_COMMIT:0:7}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              code=$?
              set -e
            else
              echo "::error title=Crawler exited with an error::$(tail -n 8 "$out/console.log" 2>/dev/null | tr '\n' ' ' | cut -c1-900)"
              code=10
            fi
            echo "::endgroup::"
            case "$code" in
              0)  result=publish; break ;;
              20) result=review; break ;;
              1)  result=fail; break ;;
              10) result=fail
                  if [ "$attempt" -lt "$ATTEMPTS" ]; then sleep "$RETRY_WAIT_SECONDS"; fi ;;
            esac
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/final"
          cp -R "$out/." "$RUNNER_TEMP/final/"
          { echo "Result: **$result** after $attempt attempt(s)."; echo
            [ -f "$out/pr-body.md" ] && cat "$out/pr-body.md"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$result" != fail ]

      - name: Package outputs and logs
        if: always() && steps.week.outputs.skip != 'true'
        # Log and report file names contain colons, which artifact uploads reject.
        run: tar -czf "$RUNNER_TEMP/crawler-run.tar.gz" -C "$RUNNER_TEMP" $(cd "$RUNNER_TEMP" && ls -d attempt-* final 2>/dev/null)

      - uses: actions/upload-artifact@v7
        if: always() && steps.week.outputs.skip != 'true'
        with:
          name: crawler-run
          path: ${{ runner.temp }}/crawler-run.tar.gz
          retention-days: 90

  publish:
    needs: generate
    if: >-
      (needs.generate.outputs.result == 'publish' || needs.generate.outputs.result == 'review') &&
      (github.event_name == 'schedule' || inputs.push_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging

      - uses: actions/download-artifact@v8
        with:
          name: crawler-run
          path: ${{ runner.temp }}

      - name: Apply the update to exactly four paths
        run: |
          tar -xzf "$RUNNER_TEMP/crawler-run.tar.gz" -C "$RUNNER_TEMP"
          python3 -m pip install --quiet --require-hashes --no-deps -r .github/fpki-crawler/requirements.txt
          python3 .github/fpki-crawler/prepare_update.py "$RUNNER_TEMP/final" . --date "${{ needs.generate.outputs.run_date }}"
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          allowed="$(printf '%s\n' _implement/fpki_notifications.md \
            _implement/tools/CACertificatesValidatingToFederalCommonPolicyG2.p7b \
            _implement/tools/crawler-lastrun.json _implement/tools/fpki-certs.gexf | sort)"
          echo "$changed"
          [ -n "$changed" ] && [ -z "$(comm -23 <(echo "$changed") <(echo "$allowed"))" ]

      - name: Commit, push the branch and open the weekly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.generate.outputs.result }}
          WEEK: ${{ needs.generate.outputs.week }}
          RUN_DATE: ${{ needs.generate.outputs.run_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Who to mention in the issue, for example "@user1 @user2". Set as a repository
          # variable. Leave it unset in forks so test runs notify no one.
          NOTIFY: ${{ vars.FPKI_CRAWLER_NOTIFY }}
        run: |
          branch="fpki-crawler/$WEEK"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add _implement/fpki_notifications.md _implement/tools
          git commit -m "automatic crawler update ($RUN_DATE)"
          # A branch left by an earlier run this week is replaced, but only if it is still the
          # version seen here. An empty value means the branch must not exist.
          seen="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          git push --force-with-lease="refs/heads/$branch:$seen" origin "$branch"

          # One issue per week, found by a marker in its body. A rerun updates the open one.
          marker="<!-- fpki-crawler-branch: $branch -->"
          title="$(date -d "$RUN_DATE" +%m%d) FPKI Graph Update"
          if [ "$RESULT" = review ]; then title="$title (needs review)"; fi
          number="$(gh issue list --state open --limit 100 --json number,body \
            --jq "map(select(.body | contains(\"fpki-crawler-branch: $branch \"))) | .[0].number // empty")"
          if [ -z "$number" ]; then
            url="$(gh issue create --title "$title" --body "$marker
          Automatically Created. Preparing the summary.")"
            number="${url##*/}"
            action=created
          else
            action=updated
          fi

          # The link opens GitHub's new PR page with the title and description filled in.
          # Long summaries are left out of the link, since very long URLs can fail.
          link="$(python3 - "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$branch" "$RUN_DATE" "$number" \
            "$RESULT" "$RUNNER_TEMP/final/pr-body.md" <<'EOF'
          import sys, urllib.parse
          from datetime import date
          repo, branch, run_date, number, result, body_file = sys.argv[1:]
          title = 'automatic crawler update, ' + date.fromisoformat(run_date).strftime('%b %-d, %Y')
          if result == 'review':
              title += ' (needs review)'
          summary = open(body_file).read()
          def url(body):
              query = urllib.parse.urlencode({'quick_pull': 1, 'title': title, 'body': body})
              return f'{repo}/compare/staging...{branch}?{query}'
          full = url(f'Closes #{number}\n\n{summary}')
          print(full if len(full) <= 6000 else url(f'Closes #{number}\n\nThe full summary is in #{number}.'))
          EOF
          )"
          {
            echo "$marker"
            echo "Automatically Created by the FPKI crawler workflow.${NOTIFY:+ $NOTIFY}"
            echo
            echo "**Next step:** [open the pull request]($link). The title and description are filled in."
            echo "Check the files, then select **Create pull request**."
            echo
            echo "Result: **$RESULT**. Branch \`$branch\`, commit \`$(git rev-parse --short HEAD)\`. [Workflow run]($RUN_URL)."
            echo
            echo '---'
            echo
            cat "$RUNNER_TEMP/final/pr-body.md"
          } > "$RUNNER_TEMP/issue-body.md"
          gh issue edit "$number" --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
          if [ "$action" = updated ]; then
            gh issue comment "$number" --body "Updated by a rerun: the branch now holds commit \`$(git rev-parse --short HEAD)\` from [this run]($RUN_URL)."
          fi
          echo "::notice title=Issue $action::#$number. Branch $branch is ready for a PR."
          echo "Issue #$number $action. Branch \`$branch\` is ready. [Open the PR]($link)." >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [generate, publish]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.generate.result == 'failure' || needs.publish.result == 'failure' ||
       needs.generate.outputs.result == 'review' || needs.generate.outputs.result == 'fail')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Comment on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title='FPKI crawler needs attention'
          message="Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ended as: ${{ needs.generate.outputs.result || 'failure' }}. Rerun it from the Actions tab with Run workflow."
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$message"
          else gh issue create --title "$title" --body "$message"; fi
