# Runs the GSA FPKI crawler weekly, checks the result, and opens a PR into staging
# that updates the same four paths as the manual process. A person reviews and merges.
name: FPKI crawler update

on:
  schedule:
    - cron: '0 14 * * 1'   # Monday 14:00 UTC
    - cron: '0 14 * * 2'   # Tuesday safety net. Stops early if this week's PR already exists
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open a PR. Turn off to only generate and check the files
        type: boolean
        default: true

permissions: {}

concurrency:
  group: fpki-crawler
  cancel-in-progress: false

env:
  CRAWLER_REPOSITORY: GSA/FPKIcrawler
  CRAWLER_COMMIT: a8b0eee3b8cb2709c4f67b083b144ba27f9683f6
  JAR_SHA256: 1c26d064e89c1b520213979b74145a75b2db040051d3e3a2397f2128986a2b36
  ROOT_SHA256: 5f9aecc24616b2191372600dd80f6dd320c8ca5a0ceb7f09c985ebf0696934fc
  # One attempt while the workflow is being proven: anything unusual fails visibly.
  # Set to '2' later for a single retry.
  ATTEMPTS: '1'
  RETRY_WAIT_SECONDS: '900'

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      result: ${{ steps.crawl.outputs.result }}
      week: ${{ steps.week.outputs.week }}
      run_date: ${{ steps.week.outputs.run_date }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v7
        with:
          ref: staging
          path: site
          persist-credentials: false

      - name: Stop if this week's update already exists
        id: week
        working-directory: site
        run: |
          week="$(TZ=America/New_York date +%G-W%V)"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "run_date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = schedule ] && \
             git ls-remote --exit-code "https://github.com/${{ github.repository }}" "refs/heads/fpki-crawler/$week" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This week's update branch already exists." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the crawler at the pinned commit
        if: steps.week.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CRAWLER_REPOSITORY }}
          ref: ${{ env.CRAWLER_COMMIT }}
          path: crawler
          persist-credentials: false

      - name: Verify the root certificate and Java helper
        if: steps.week.outputs.skip != 'true'
        run: |
          echo "$JAR_SHA256  crawler/py-crawler/py_crawler/data/pathbuilder-1.2.jar" | sha256sum -c -
          echo "$ROOT_SHA256  crawler/py-crawler/py_crawler/data/fcpcag2.crt" | sha256sum -c -

      - uses: actions/setup-python@v7
        if: steps.week.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        if: steps.week.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked Python dependencies
        if: steps.week.outputs.skip != 'true'
        run: pip install --require-hashes --no-deps -r site/.github/fpki-crawler/requirements.txt

      - name: Record whether DoD revocation servers respond
        if: steps.week.outputs.skip != 'true'
        run: |
          for url in http://ocsp.disa.mil/ http://crl.disa.mil/ http://repo.fpki.gov/; do
            result=$(curl -s -o /dev/null --max-time 10 -w '%{http_code} in %{time_total}s' "$url" || echo "no response within 10s")
            echo "::notice title=Server check::$url $result"
          done

      - name: Crawl and check, rerunning when the result looks incomplete
        id: crawl
        if: steps.week.outputs.skip != 'true'
        env:
          # Java waits 15 seconds for each unreachable OCSP server, but the crawler stops the
          # Java helper after 10. Accepted certificates are decided by CRLs, so wait 1 second.
          JAVA_TOOL_OPTIONS: -Dcom.sun.security.ocsp.timeout=1
        run: |
          result=fail
          for attempt in $(seq 1 "$ATTEMPTS"); do
            out="$RUNNER_TEMP/attempt-$attempt"
            mkdir -p "$out"
            echo "::group::Attempt $attempt"
            started=$(date +%s)
            if (cd crawler/py-crawler && set -o pipefail && OUTPUT_DIR="$out" timeout 30m python -m py_crawler 2>&1 | tee "$out/console.log"); then
              echo "::notice title=Crawl finished::Attempt $attempt took $(( $(date +%s) - started )) seconds."
              set +e
              python site/.github/fpki-crawler/check_run.py "$out" site/_implement/tools \
                --exclusions crawler/py-crawler/exclude_thumbprints.txt \
                --note "Crawler ${CRAWLER_REPOSITORY}@${CRAWLER_COMMIT:0:7}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              code=$?
              set -e
            else
              echo "::error title=Crawler exited with an error::$(tail -n 8 "$out/console.log" 2>/dev/null | tr '\n' ' ' | cut -c1-900)"
              code=10
            fi
            echo "::endgroup::"
            case "$code" in
              0)  result=publish; break ;;
              20) result=review; break ;;
              1)  result=fail; break ;;
              10) result=fail
                  if [ "$attempt" -lt "$ATTEMPTS" ]; then sleep "$RETRY_WAIT_SECONDS"; fi ;;
            esac
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/final"
          cp -R "$out/." "$RUNNER_TEMP/final/"
          { echo "Result: **$result** after $attempt attempt(s)."; echo
            [ -f "$out/pr-body.md" ] && cat "$out/pr-body.md"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$result" != fail ]

      - name: Package outputs and logs
        if: always() && steps.week.outputs.skip != 'true'
        # Log and report file names contain colons, which artifact uploads reject.
        run: tar -czf "$RUNNER_TEMP/crawler-run.tar.gz" -C "$RUNNER_TEMP" $(cd "$RUNNER_TEMP" && ls -d attempt-* final 2>/dev/null)

      - uses: actions/upload-artifact@v7
        if: always() && steps.week.outputs.skip != 'true'
        with:
          name: crawler-run
          path: ${{ runner.temp }}/crawler-run.tar.gz
          retention-days: 90

  publish:
    needs: generate
    if: >-
      (needs.generate.outputs.result == 'publish' || needs.generate.outputs.result == 'review') &&
      (github.event_name == 'schedule' || inputs.open_pr)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging

      - uses: actions/download-artifact@v8
        with:
          name: crawler-run
          path: ${{ runner.temp }}

      - name: Apply the update to exactly four paths
        run: |
          tar -xzf "$RUNNER_TEMP/crawler-run.tar.gz" -C "$RUNNER_TEMP"
          python3 -m pip install --quiet --require-hashes --no-deps -r .github/fpki-crawler/requirements.txt
          python3 .github/fpki-crawler/prepare_update.py "$RUNNER_TEMP/final" . --date "${{ needs.generate.outputs.run_date }}"
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          allowed="$(printf '%s\n' _implement/fpki_notifications.md \
            _implement/tools/CACertificatesValidatingToFederalCommonPolicyG2.p7b \
            _implement/tools/crawler-lastrun.json _implement/tools/fpki-certs.gexf | sort)"
          echo "$changed"
          [ -n "$changed" ] && [ -z "$(comm -23 <(echo "$changed") <(echo "$allowed"))" ]

      - name: Commit, push and open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.generate.outputs.result }}
          WEEK: ${{ needs.generate.outputs.week }}
          RUN_DATE: ${{ needs.generate.outputs.run_date }}
        run: |
          branch="fpki-crawler/$WEEK"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add _implement/fpki_notifications.md _implement/tools
          git commit -m "automatic crawler update ($RUN_DATE)"
          git push origin "$branch"
          title="FPKI graph update, $(date -d "$RUN_DATE" '+%b %-d, %Y')"
          draft=""
          if [ "$RESULT" = review ]; then draft="--draft"; title="$title (needs review)"; fi
          # Always target this repository. In a fork, gh would otherwise default to the parent.
          gh pr create --repo "$GITHUB_REPOSITORY" --base staging --head "$branch" --title "$title" \
            --body-file "$RUNNER_TEMP/final/pr-body.md" $draft

  notify:
    needs: [generate, publish]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.generate.result == 'failure' || needs.publish.result == 'failure' ||
       needs.generate.outputs.result == 'review' || needs.generate.outputs.result == 'fail')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Comment on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title='FPKI crawler needs attention'
          message="Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ended as: ${{ needs.generate.outputs.result || 'failure' }}. Rerun it from the Actions tab with Run workflow."
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$message"
          else gh issue create --title "$title" --body "$message"; fi
